name: quantum-hyperfield

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: ${QNH_IMAGE:-quantum-hyperfield-web:local}
    container_name: ${QNH_CONTAINER:-quantum-hyperfield}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QNH_DATA_DIR: /var/data
      QNH_DB_PATH: /var/data/hyperfield.db
      QNH_MODELS_DIR: /var/data/models
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      QNH_CONTAINER_READ_ONLY: "1"
    ports:
      - "${QNH_BIND_ADDR:-127.0.0.1}:${QNH_PORT:-8080}:8080"
    volumes:
      - hyperfield-data:/var/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${QNH_MEMORY_LIMIT:-1536m}
    cpus: ${QNH_CPU_LIMIT:-2.0}
    stop_grace_period: 25s
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - edge
      - backend

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:${WEAVIATE_VERSION:-1.32.4}
    container_name: ${QNH_WEAVIATE_CONTAINER:-quantum-hyperfield-weaviate}
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      # Weaviate is intentionally not host-published and only exists on the
      # Docker-internal backend network. For multi-tenant deployments, enable
      # API-key/OIDC authentication and set WEAVIATE_API_KEY in the app.
    volumes:
      - weaviate-data:/var/lib/weaviate
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${WEAVIATE_MEMORY_LIMIT:-2g}
    cpus: ${WEAVIATE_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/.well-known/ready >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 4s
      retries: 10
      start_period: 25s
    networks:
      - backend

networks:
  edge:
    driver: bridge
  backend:
    internal: true

volumes:
  hyperfield-data:
  weaviate-data:
